}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        flatDir { dirs file("app_pojavlauncher/libs") }
        maven { url "https://jitpack.io" }
    }
}

