// 두 원본 버전의 Java 바인딩은 Java 8 바이트코드로 유지한다.
gradle.beforeProject { project ->
    if (gradle.startParameter.projectProperties['androidImguiGeneration'] == '90') {
        project.plugins.withId('java') {
            project.tasks.withType(JavaCompile).configureEach {
                javaCompiler.set(project.javaToolchains.compilerFor {
                    languageVersion.set(JavaLanguageVersion.of(17))
                })
                options.release.set(8)
            }
        }
    }
}

// 원본 생성 Java를 수정하지 않고 Android용 JNI 소스만 생성한다.
gradle.projectsEvaluated {
    def binding = gradle.rootProject.findProject(':imgui-binding')
    if (binding == null) {
        return
    }
    binding.tasks.register('generateAndroidJni') {
        dependsOn binding.tasks.named('classes')
        def patches = gradle.rootProject.tasks.findByName('applyVendorPatches')
        if (patches != null) {
            dependsOn patches
        }

        doLast {
            def outputProperty = binding.providers.gradleProperty('androidJniOutput')
            def generationProperty = binding.providers.gradleProperty('androidImguiGeneration')
            def output = new File(outputProperty.get())
            def generation = generationProperty.get()
            binding.delete output
            output.mkdirs()

            def taskProvider = binding.tasks.named('generateLibs')
            def nativeTask = taskProvider.get()
            def generatorClass = nativeTask.class.classLoader.loadClass(
                'com.badlogic.gdx.jnigen.NativeCodeGenerator'
            )
            def constructor = generatorClass.getDeclaredConstructor()
            def generator = constructor.newInstance()
            generator.generate(
                binding.file('src/generated/java').absolutePath,
                binding.file('build/classes/java/main').absolutePath,
                output.absolutePath
            )

            def includes = [
                'include/imgui',
                'include/imnodes',
                'include/imgui-node-editor',
                'include/imguizmo',
                'include/implot',
                'include/ImGuiColorTextEdit',
                'include/imgui_club/imgui_memory_editor',
                'include/imgui-knobs'
            ]
            binding.copy {
                includes.each { directory ->
                    from(gradle.rootProject.file(directory)) {
                        include '*.h', '*.cpp', '*.inl'
                    }
                }
                from(binding.file('src/main/native'))
                into output
                duplicatesStrategy = DuplicatesStrategy.INCLUDE
            }
            binding.copy {
                from binding.file('src/main/native/imconfig.h')
                into output
            }

            if (generation == '90') {
                // Flashback은 원본 imgui 패키지를 moulberry90으로 재배치한 바인딩을 사용한다.
                binding.fileTree(output)
                        .matching {
                    include '**/*.cpp', '**/*.h'
                }.each { source ->
                    def text = source.getText('UTF-8')
                    text = text.replace('Java_imgui_', 'Java_imgui_moulberry90_')
                    text = text.replace('Limgui_', 'Limgui_moulberry90_')
                    text = text.replace('Limgui/', 'Limgui/moulberry90/')
                    text = text.replace('"imgui/', '"imgui/moulberry90/')
                    // 이 Windows 전용 함수는 모드에서 glfw 하위 패키지로 이동했다.
                    text = text.replace(
                        'Java_imgui_moulberry90_lwjgl3_glfw_',
                        'Java_imgui_moulberry90_glfw_'
                    )
                    source.setText(text, 'UTF-8')
                }
            }
        }
    }
}
