name: Runtime library
on:
  push:
    branches: [runtime-library]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/languagelist_updater.sh
      - run: ./gradlew :MioLibPatcher:test :app_pojavlauncher:testDebugUnitTest :app_pojavlauncher:assembleDebug :imgui_moulberry92:assembleDebug :imgui_moulberry90:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: amethyst-runtime
          path: |
            app_pojavlauncher/build/outputs/aar/*.aar
            imgui_moulberry92/build/outputs/aar/*.aar
            imgui_moulberry90/build/outputs/aar/*.aar
