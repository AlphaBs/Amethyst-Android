plugins { id 'com.android.library' }
group = 'org.angelauramc'
version = '0.1.0'
android {
    namespace 'net.kdt.pojavlaunch'
    compileSdk 35
    ndkVersion '27.3.13750724'
    defaultConfig {
        minSdk 26
        buildConfigField 'String', 'VERSION_NAME', '"amethyst-runtime-0.1.0"'
        resValue 'string', 'curseforge_api_key', 'DUMMY'
        resValue 'string', 'application_package', 'org.angelauramc.runtime'
        resValue 'string', 'storageProviderAuthorities', 'org.angelauramc.runtime.documents'
        resValue 'string', 'shareProviderAuthority', 'org.angelauramc.runtime.controls'
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild { ndkBuild { arguments 'APP_SHORT_COMMANDS=true' } }
        ndk { abiFilters.addAll(providers.gradleProperty('runtimeAbis').getOrElse('arm64-v8a,x86_64').split(',')) }
    }
    externalNativeBuild { ndkBuild { path file('src/main/jni/Android.mk') } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { prefab true; buildConfig true; resValues true }
    packaging { jniLibs { useLegacyPackaging true; pickFirsts += ['**/libbytehook.so'] } }
    lint { abortOnError true }
}
afterEvaluate {
    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
        dependsOn ':forge_installer:jar', ':arc_dns_injector:jar', ':MioLibPatcher:jar', ':jre_lwjgl3glfw:jar'
    }
    tasks.matching { it.name.toLowerCase().contains('lint') }.configureEach {
        dependsOn ':forge_installer:jar', ':arc_dns_injector:jar', ':MioLibPatcher:jar', ':jre_lwjgl3glfw:jar'
    }
}
dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    // implementation 'com.wu-man:android-bsf-api:3.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    //implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'

    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'

    // implementation 'com.intuit.sdp:sdp-android:1.0.5'
    // implementation 'com.intuit.ssp:ssp-android:1.0.5'

    implementation 'org.tukaani:xz:1.8'
    // Our version of exp4j can be built from source at
    // https://github.com/PojavLauncherTeam/exp4j
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.10'

    // implementation 'net.sourceforge.streamsupport:streamsupport-cfuture:1.7.0'

    implementation 'top.fifthlight.touchcontroller:proxy-client-android:0.0.4'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    fileTree(dir: 'libs', include: ['*.aar']).each { artifact ->
        implementation(name: artifact.name.replace('.aar', ''), ext: 'aar')
    }

    implementation "net.java.dev.jna:jna:5.14.0@aar"

    implementation project(":androidnsbypass")

}
